name: build-apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Lizmo.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lizmo-apk
          path: Lizmo.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.${{ github.run_number }}
          name: "Lizmo v0.6.${{ github.run_number }} - Signed Release"
          body: |
            ## 🏝️ Lizmo v0.6.${{ github.run_number }}

            ### 🛡️ Signed & Safe Release
            This APK is built and signed with the official Lizmo release key.
            It is **not** a debug build — no test certificates, no Google Play Protect warnings.

            ### 🌟 What's New in v0.6.0
            - 🎮 **Full Voice Media Controls**: 20+ hands-free voice commands:
              - ⏸ **Playback**: pause, resume, next, back/previous, restart (0:00), stop.
              - 🔀 **Shuffle**: shuffle on, shuffle off, toggle shuffle.
              - 🔁 **Repeat Modes**: repeat one / repeat song, repeat all / playlist, repeat off.
              - ⏩ **Seeking**: fast-forward X seconds, seek back X seconds, jump to MM:SS.
              - 🔊 **Volume**: step up/down, set volume percentage ("volume 50%"), max volume, mute, unmute, query volume level.
              - ❤️ **Like / Dislike**: thumbs up / like current song, thumbs down / dislike.
              - ℹ️ **Track Query**: "what's playing?", "what song is this?".
            - 🖥️ **On-Screen Command HUD**: Dynamic pill banner sliding into the island confirming every action in real time with haptics.
            - 🎯 **Active Music Platform Detection**: Automatically detects active player (Spotify, YouTube Music, Apple Music, JioSaavn, SoundCloud, VLC, etc.) and routes playback searches seamlessly.
            - 🎙️ **Microphone Hearing & Sensitivity Levels**: Low, Medium, and High sensitivity profiles for quiet, normal, and noisy environments.
            - ⚡ **Instant Wake Word (<50ms)**: Fast phoneme wake-word matcher; island springs up in seconds.
            - 🏝️ **Dynamic Island Overlay**: iOS-style pill floating above all apps with responsive expand/collapse animations.
            - 🎤 **Synced Karaoke Lyrics**: Real-time LRCLIB and NetEase karaoke lyric synchronization.
            - 🌐 **Live English Translation**: Real-time lyric translation into English with language override selector.
            - 🎨 **5 Designer Themes**: Glass, Neon, Minimal (100% OLED black), Sunset, and Mono.

            ### 📲 Quick Installation
            1. Download **Lizmo.apk** below.
            2. Open the APK and tap **Install** (allow *Install from Unknown Sources* if prompted).
            3. Launch **Lizmo** and grant Notification Access and Overlay permissions.
            4. *(Android 13+)* If notification access is greyed out: `Settings > Apps > Lizmo > Menu (⋮) > Allow restricted settings`.
          files: Lizmo.apk
          generate_release_notes: true
