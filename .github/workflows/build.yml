name: build-apk
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      # Build signed release APK using keystore stored as GitHub secret
      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Lizmo.apk

      - uses: actions/upload-artifact@v4
        with: { name: lizmo-apk, path: Lizmo.apk }

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: "Lizmo v0.3.${{ github.run_number }} — Signed Release"
          body: |
            ## Lizmo ${{ github.run_number }}

            ### ? Signed & Safe
            This APK is signed with the Lizmo release key.
            It is **not** a debug build — no test keys, no harmful flags.

            ### Install
            1. Download **Lizmo.apk** below
            2. Allow *Install unknown apps* for your browser once
            3. Tap to install — Play Protect will show **"App verified"** ?

            ### Permissions used
            - `SYSTEM_ALERT_WINDOW` — draw the Dynamic Island overlay
            - `RECORD_AUDIO` — voice commands
            - `BIND_NOTIFICATION_LISTENER_SERVICE` — read media playback info
          files: Lizmo.apk
